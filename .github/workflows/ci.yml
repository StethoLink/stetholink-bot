name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      AI_PROVIDER: mock
      CLINICAL_DATA_SOURCE: synthetic
      NEXT_PUBLIC_API_MODE: http
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: node --test tests/smoke/*.test.mts
      - run: npm run build
